<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Outer high-contrast black border -->
  <path d="M 12 1
           C 10.5 1, 9.5 2, 9.8 3.5
           L 11.5 13
           C 10 13, 7.5 14, 6.5 15.5
           C 5.5 17, 5 19, 5 21
           C 5 25, 8.5 29, 13 29
           L 18 29
           C 22.5 29, 24.5 25, 24.5 20
           L 24.5 18
           L 14.5 3
           C 14 1.5, 13 1, 12 1
           Z"
        fill="#080c16" />

  <!-- Inner white hand layout -->
  <path d="M 12 2
           C 11 2, 10.5 2.5, 10.8 3.5
           L 12.8 13.5
           L 10.5 14
           C 9.2 14.5, 7.8 15.5, 7.5 16.5
           C 6.5 18, 6 19.5, 6 21
           C 6 24.5, 9 27.5, 13 27.5
           L 18 27.5
           C 21.5 27.5, 23.5 24, 23.5 20
           L 23.5 18.5
           L 13.5 3.5
           C 13 2.5, 12.5 2, 12 2
           Z"
        fill="#ffffff" />

  <!-- Anatomical internal detail lines for right hand with extended pinky pointing up-left -->
  <!-- Clenched Index Finger fold (leftmost curled finger) -->
  <path d="M 7.5 16.5 C 7.5 20, 10.5 20, 10.5 17.5" stroke="#080c16" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Clenched Middle Finger fold -->
  <path d="M 10.5 15.5 C 10.5 19.5, 13.5 19.5, 13.5 16.5" stroke="#080c16" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Clenched Ring Finger fold -->
  <path d="M 13.5 14.5 C 13.5 19, 16.5 19, 16.5 15.5" stroke="#080c16" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Folded Thumb overlay contour (folding from left to right) -->
  <path d="M 6 21.5 C 8 22.5, 12 22.5, 15 20" stroke="#080c16" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Crease dividing palm from extended pinky on the right -->
  <path d="M 15.5 15.5 C 17.5 16, 21 16.5, 23.5 18.5" stroke="#080c16" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
